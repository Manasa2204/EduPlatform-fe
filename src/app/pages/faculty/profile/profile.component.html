<div class="faculty-page">
  <div class="page-header">
    <h1>Faculty Profile</h1>
    <p>Manage your personal information and expertise</p>
  </div>

  <div class="container" style="max-width: 800px;">
    
    <div class="card" style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; padding: 20px;">
      <div>
        <h3 style="margin: 0 0 8px 0;">Google Calendar Integration</h3>
        <p style="margin: 0; color: var(--text-secondary); font-size: 0.9rem;">
          Connect your Google account to automatically schedule Google Meet sessions.
        </p>
      </div>
      <div>
        <button *ngIf="!isGoogleConnected" class="btn btn-outline" (click)="connectGoogle()">
          Connect Google Calendar
        </button>
        <span *ngIf="isGoogleConnected" style="color: green; font-weight: bold; display: flex; align-items: center; gap: 8px;">
          ✅ Connected
        </span>
      </div>
    </div>

    <div class="card">
      <div *ngIf="isLoading" class="empty-state">
        <p>Loading profile...</p>
      </div>

      <div *ngIf="!isLoading">
        <div *ngIf="successMessage" class="alert alert-success">
          ✅ {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="alert alert-error">
          ❌ {{ errorMessage }}
        </div>

        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          
          <div class="form-row-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" formControlName="name" placeholder="John Doe">
            </div>
            
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" [value]="email" disabled style="background-color: var(--bg-secondary); cursor: not-allowed;">
            </div>
          </div>

          <div class="form-row-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
              <label>Expertise</label>
              <input type="text" formControlName="expertise" placeholder="e.g. Machine Learning, Web Development">
            </div>

            <div class="form-group">
              <label>Phone (Private)</label>
              <input type="tel" formControlName="phone" placeholder="+1 234 567 890">
            </div>
          </div>

          <div class="form-group">
            <label>LinkedIn Profile URL</label>
            <input type="url" formControlName="linkedin" placeholder="https://linkedin.com/in/username">
          </div>

          <div class="form-group">
            <label>Professional Bio</label>
            <textarea formControlName="bio" rows="4" placeholder="Tell students about yourself and your background..."></textarea>
          </div>

          <div class="form-group">
            <label>Work Experience</label>
            <textarea formControlName="experience" rows="3" placeholder="Briefly describe your relevant industry experience..."></textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
            <button type="submit" class="btn btn-primary btn-lg" [disabled]="!profileForm.valid || isSaving">
              <span *ngIf="isSaving">Saving...</span>
              <span *ngIf="!isSaving">Save Profile</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
